<!doctype html> 

<html lang="fr"> 

<head> 
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>ManiView</title> 
  <link href="style.css" rel="stylesheet" /> 
</head>

<body>

  <button id="uiToggle" class="uiToggle" aria-expanded="true" aria-label="Afficher/masquer les réglages">
  ≡
  </button>
  
  <div class="app">

    <header class="top"> 
    
      <div class="brand">
        <div class="logo">ManiView</div> 
      </div>
      
      <div class="controls">

        <label class="field"> 
          <span>T haut (s)</span>
          <select id="apneaSec">
            <option value="10.0">10,0</option>
            <option value="20.0">20,0</option>
            <option value="30.0" selected>30,0</option>
          </select>
        </label>

        <div class="field"> 
          <span>T bas (s)</span>

          <div class="tbasControl">
            <button id="expSec" class="tbasDisplay" type="button">4,5</button>

            <div class="tbasArrows">
              <button id="tbasUpBtn" class="tbasArrowBtn" type="button" aria-label="Augmenter T bas">▲</button>
              <button id="tbasDownBtn" class="tbasArrowBtn" type="button" aria-label="Diminuer T bas">▼</button>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button id="nudgeBack" class="ghost" disabled>- Nudge</button>
          <button id="nudgeFwd" class="ghost" disabled>+ Nudge</button>
        </div>

        <div class="buttons">
          <button id="startBtn" class="primary">Start</button>
          <button id="stopBtn" class="ghost" disabled>Stop</button>
          <button id="resetBtn" class="ghost" disabled>Réinitialiser</button>
          <button id="jumpSortieBtn" class="ghost">Saut → Sortie</button>
        </div>

        <div class="optionsLine">
          
          <label class="toggle">
            <input id="beepEnabled" type="checkbox" checked />
            <span>Son activé</span>
          </label>

          <label class="field fieldCompact">
            <span>Nudge (s)</span>
            <select id="nudgeSec">
              <option value="0.1">0,1</option>
              <option value="0.2" selected>0,2</option>
              <option value="0.4">0,4</option>
            </select>
          </label>
        </div>

        <div class="readout">
          <span id="phaseText">Stopped</span>
          <span class="mono" id="tText">t = 0.000 s</span>
          <span class="mono" id="cycleText">Cycle = 34.500 s</span>
        </div>

      </div>
    </header>

    <main class="stage">

      <div class="labels">
        <div class="label" id="startLabel">
          <img class="labelImg" src="ImageHold.png" alt="Gardez la position" />
        </div>

        <div class="label" id="sortieLabel">
          <img id="sortieImg" class="labelImg" src="ImageExpi.png" alt="Videz les poumons" />
        </div>

        <div class="label" id="arriveeLabel">
          <img id="arriveeImg" class="labelImg" src="ImageInspi.png" alt="Laissez l'air rentrer" />
        </div>

        <div class="label" id="inspiStartLabel">
          <img class="labelImg" src="ImageInspi.png" alt="Laissez l'air rentrer" />
        </div>

      </div>

      
      <div class="barWrap">
        <div class="bar" aria-label="Ventilation cycle"> 
          <div class="fill" id="fill"></div> 
          <div class="marker" id="marker0"></div>
          <div class="marker" id="marker3"></div> 
          <div class="marker" id="marker30"></div>
          <div class="endCap" aria-hidden="true"></div> 
        </div>
        <div class="directionArrow"></div> 
      </div>

      <div class="countdown" id="countdown" hidden>
        <div class="countNum" id="countNum">3</div>
      </div>

    </main>
  </div>

  <div id="tbasKeypadOverlay" class="tbasKeypadOverlay" hidden>
    <div class="tbasKeypad">
      <div id="tbasKeypadDisplay" class="tbasKeypadDisplay">4,5</div>

      <div class="tbasKeypadGrid">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>

        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>

        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>

        <button type="button" data-key=",">,</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="backspace">⌫</button>
      </div>

      <div class="tbasKeypadActions">
        <button id="tbasCancelBtn" type="button">Annuler</button>
        <button id="tbasOkBtn" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>

</html>
